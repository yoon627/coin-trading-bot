name: CI/CD (test + GHCR + Vultr)

# PR 은 테스트만 돌린다. push 와 수동 실행은 이미지를 GHCR 에 올리고, main push 와 main 수동 실행만 Vultr 에 배포한다.
on:
  push:
    branches: [main]
    # 배포는 엔진 재시작이라 이미지에 들어가지 않는 문서 변경으로는 배포하지 않는다.
    # deploy/·Dockerfile·gradle 처럼 배포에 영향을 주는 경로는 넣지 않는다.
    # bot/·common/ 의 실행 리소스에 .md 를 두지 않는다. 그 파일만 바꾼 push 는 배포 없이 건너뛴다.
    # 아래 Check deployment commit is current main 의 제외 목록과 같게 유지한다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # DB 통합테스트용 Postgres. 운영과 같은 이미지를 쓴다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: trading
          TEST_DB_USER: trading
          TEST_DB_PASSWORD: trading
          # CI 에서는 DB 통합테스트 skip 을 실패로 처리한다.
          DB_TESTS_REQUIRED: 'true'
        run: ./gradlew test --parallel

      # gradle 은 skip 된 테스트도 성공으로 끝내므로 결과 XML 로 실제 실행 여부를 확인한다.
      - name: DB 통합테스트가 실제로 실행됐는지 확인
        run: |
          set -euo pipefail
          # scripts/run-db-tests.sh 의 DB_TEST_CLASSES 와 같은 목록을 유지한다.
          for c in TradingStateRoundTripTest TradeRecordRoundTripTest UserSettingsUpdateRoundTripTest ExchangeDimensionRoundTripTest UserBrokerKeyRoundTripTest; do
            XML="bot/build/test-results/test/TEST-com.trading.bot.persistence.$c.xml"
            if [ ! -f "$XML" ]; then
              echo "::error::DB 통합테스트 결과가 없다 — 실행되지 않았다 ($XML)"
              exit 1
            fi
            attrs="$(head -3 "$XML")"
            ran="$(printf '%s' "$attrs" | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')"
            skipped="$(printf '%s' "$attrs" | grep -o 'skipped="[0-9]*"' | head -1 | tr -dc '0-9')"
            echo "DB 통합테스트 $c: 실행 ${ran:-?}건 / skip ${skipped:-?}건"
            if [ "${ran:-0}" = "0" ] || [ "${skipped:-1}" != "0" ]; then
              echo "::error::DB 통합테스트가 건너뛰어졌다 — services: postgres 와 TEST_DB_* 를 확인하라"
              exit 1
            fi
          done

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 크로스 빌드용 에뮬레이션
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push app image (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vultr:
    needs: [test, build-and-push]
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vultr-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check deployment commit is current main
        id: main-head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 뒤따른 문서 전용 push 는 paths-ignore 로 실행이 생기지 않는다. 여기서 건너뛰면
          # 이 커밋을 배포할 실행이 없으므로, 차이가 배포 무관 경로뿐이면 그대로 배포한다.
          # 제외 목록은 on.push.paths-ignore 와 같게 유지한다.
          code_changes="$(git diff --name-only "$GITHUB_SHA" "$current_main" -- . \
            ':(exclude)**.md' ':(exclude)docs/**')"

          if [[ -z "$code_changes" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "origin/main($current_main) is ahead of $GITHUB_SHA but differs only in non-deploy paths — deploying anyway"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "Skipping stale deployment for $GITHUB_SHA; origin/main is $current_main"
            echo "code changes since this commit:"
            echo "$code_changes"
          fi

      - name: Prepare Vultr deploy files
        if: steps.main-head.outputs.current == 'true'
        env:
          VULTR_DEPLOY_ENV: ${{ secrets.VULTR_DEPLOY_ENV }}
          VULTR_PUBLIC_IP: ${{ secrets.VULTR_PUBLIC_IP }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail

          : "${VULTR_DEPLOY_ENV:?VULTR_DEPLOY_ENV secret is required}"
          : "${VULTR_PUBLIC_IP:?VULTR_PUBLIC_IP secret is required}"
          : "${VULTR_SSH_PRIVATE_KEY:?VULTR_SSH_PRIVATE_KEY secret is required}"
          : "${VULTR_SSH_USER:?VULTR_SSH_USER secret is required}"

          if ! [[ "$VULTR_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "ERROR: VULTR_PUBLIC_IP must be an IPv4 address" >&2
            exit 1
          fi
          if ! [[ "$VULTR_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]; then
            echo "ERROR: VULTR_SSH_USER contains unsupported characters" >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$VULTR_DEPLOY_ENV" > deploy/vultr/.env
          printf 'APP_NAME=coin-trading-bot\nAPP_VERSION=%s\nGHCR_IMAGE=ghcr.io/%s\nSSH_USER=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VULTR_SSH_USER" >> deploy/vultr/.env
          printf '%s' "$VULTR_SSH_PRIVATE_KEY" > deploy/vultr/coin-trading-bot-key.pem
          chmod 600 deploy/vultr/.env deploy/vultr/coin-trading-bot-key.pem
          known_hosts_file="$GITHUB_WORKSPACE/deploy/vultr/known_hosts"
          test -s "$known_hosts_file"

          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" -o ConnectTimeout=10 \
            -i deploy/vultr/coin-trading-bot-key.pem)
          remote_last_good="$(ssh "${ssh_opts[@]}" \
            "${VULTR_SSH_USER}@${VULTR_PUBLIC_IP}" \
            'cd /opt/app && if test -s .last-good-sha; then tr -d "[:space:]" < .last-good-sha; else cid="$(docker compose ps -aq app | head -n 1)" && test -n "$cid" && test "$(docker inspect --format "{{.State.Health.Status}}" "$cid")" = healthy && docker inspect --format "{{.Config.Image}}" "$cid"; fi')"
          last_good_sha="${remote_last_good##*:}"
          if ! [[ "$last_good_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: no valid persisted/healthy Vultr rollback SHA; refusing automatic deployment" >&2
            exit 1
          fi
          printf 'PUBLIC_IP=%s\nLAST_GOOD_SHA=%s\n' "$VULTR_PUBLIC_IP" "$last_good_sha" \
            > deploy/vultr/.state
          chmod 600 deploy/vultr/.state

      - name: Deploy to Vultr
        if: steps.main-head.outputs.current == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ github.workspace }}/deploy/vultr/known_hosts
        run: ./deploy/vultr/deploy.sh deploy

      - name: Remove Vultr deploy files
        if: always()
        run: |
          rm -f deploy/vultr/.env deploy/vultr/.state deploy/vultr/coin-trading-bot-key.pem
