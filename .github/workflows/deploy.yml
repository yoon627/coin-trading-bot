name: CI/CD (test + GHCR + Vultr)

# PR 은 테스트만 돌린다. push 와 수동 실행은 이미지를 GHCR 에 올린다.
# 배포는 엔진 재시작이라 push 로는 하지 않고 main 수동 실행으로만 한다.
on:
  push:
    branches: [main]
    # 문서만 바뀐 push 는 테스트·이미지 빌드도 건너뛴다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 마지막 정상 배포 이후 운영에 들어가는 파일 변경이 없어도 배포한다(secret 만 바꾼 경우 등)
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # DB 통합테스트용 Postgres. 운영과 같은 이미지를 쓴다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # 배포는 바뀐 Caddyfile 을 reload 로 적용하므로 틀린 설정은 머지 전에 막는다. 이미지는 compose 의 caddy 와 같게 둔다
      # (CaddyValidateStepTest). APP_DOMAIN 이 비면 사이트 주소가 빈 문자열이 되어 임의 도메인을 준다.
      - name: Caddyfile 검증 (운영과 같은 이미지)
        run: >-
          docker run --rm -e APP_DOMAIN=bot.example.test
          -v "$PWD/deploy/vultr/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # 기본 enhanced 캐시는 별도 이용약관을 받아야 해서 MIT basic 구현만 쓴다.
          cache-provider: basic
      - name: Test
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: trading
          TEST_DB_USER: trading
          TEST_DB_PASSWORD: trading
          # CI 에서는 DB 통합테스트 skip 을 실패로 처리한다.
          DB_TESTS_REQUIRED: 'true'
        run: ./gradlew test --parallel

      # gradle 은 skip 된 테스트도 성공으로 끝내므로 결과 XML 로 실제 실행 여부를 확인한다.
      - name: DB 통합테스트가 실제로 실행됐는지 확인
        run: |
          set -euo pipefail
          # scripts/run-db-tests.sh 의 DB_TEST_CLASSES 와 같은 목록을 유지한다.
          for c in TradingStateRoundTripTest TradeRecordRoundTripTest UserSettingsUpdateRoundTripTest ExchangeDimensionRoundTripTest UserBrokerKeyRoundTripTest; do
            XML="bot/build/test-results/test/TEST-com.trading.bot.persistence.$c.xml"
            if [ ! -f "$XML" ]; then
              echo "::error::DB 통합테스트 결과가 없다 — 실행되지 않았다 ($XML)"
              exit 1
            fi
            attrs="$(head -3 "$XML")"
            ran="$(printf '%s' "$attrs" | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')"
            skipped="$(printf '%s' "$attrs" | grep -o 'skipped="[0-9]*"' | head -1 | tr -dc '0-9')"
            echo "DB 통합테스트 $c: 실행 ${ran:-?}건 / skip ${skipped:-?}건"
            if [ "${ran:-0}" = "0" ] || [ "${skipped:-1}" != "0" ]; then
              echo "::error::DB 통합테스트가 건너뛰어졌다 — services: postgres 와 TEST_DB_* 를 확인하라"
              exit 1
            fi
          done

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 같은 커밋의 push 실행과 수동 실행이 함께 빌드하면 같은 태그를 두 번 덮는다. 어느 쪽이 먼저 오든 뒤의 실행은
    # 앞의 빌드를 기다렸다가 아래 이미지 확인에서 빌드를 건너뛴다.
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # arm64 크로스 빌드용 에뮬레이션
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 베이스 이미지 태그가 떠 있어 같은 커밋을 다시 빌드하면 같은 태그의 내용이 바뀐다. 이미 배포·검증한 태그를
      # 덮으면 재기동·롤백이 검증하지 않은 이미지를 받으므로, 태그가 없을 때만 빌드한다(force 여도). 새 커밋의 push 는
      # 태그가 없으니 늘 빌드하고, 재실행·같은 커밋의 수동 실행이 건너뛴다.
      # 베이스 이미지 패치는 새 커밋으로 받는다 — 새 태그라 직전 정상 SHA 로 자동 롤백할 수 있다.
      - name: Check existing image for this commit
        id: image
        shell: bash
        run: |
          ref="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA 이미지가 이미 있어 다시 빌드하지 않는다"
          else
            echo "$ref 이미지를 확인하지 못해 빌드한다: ${out##*$'\n'}"
          fi
      - name: Build and push app image (amd64 + arm64)
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vultr:
    needs: [test, build-and-push]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vultr-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Vultr deploy files
        id: prepare
        env:
          VULTR_DEPLOY_ENV: ${{ secrets.VULTR_DEPLOY_ENV }}
          VULTR_PUBLIC_IP: ${{ secrets.VULTR_PUBLIC_IP }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail

          : "${VULTR_DEPLOY_ENV:?VULTR_DEPLOY_ENV secret is required}"
          : "${VULTR_PUBLIC_IP:?VULTR_PUBLIC_IP secret is required}"
          : "${VULTR_SSH_PRIVATE_KEY:?VULTR_SSH_PRIVATE_KEY secret is required}"
          : "${VULTR_SSH_USER:?VULTR_SSH_USER secret is required}"

          if ! [[ "$VULTR_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "ERROR: VULTR_PUBLIC_IP must be an IPv4 address" >&2
            exit 1
          fi
          if ! [[ "$VULTR_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]; then
            echo "ERROR: VULTR_SSH_USER contains unsupported characters" >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$VULTR_DEPLOY_ENV" > deploy/vultr/.env
          printf 'APP_NAME=coin-trading-bot\nAPP_VERSION=%s\nGHCR_IMAGE=ghcr.io/%s\nSSH_USER=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VULTR_SSH_USER" >> deploy/vultr/.env
          printf '%s' "$VULTR_SSH_PRIVATE_KEY" > deploy/vultr/coin-trading-bot-key.pem
          chmod 600 deploy/vultr/.env deploy/vultr/coin-trading-bot-key.pem
          known_hosts_file="$GITHUB_WORKSPACE/deploy/vultr/known_hosts"
          test -s "$known_hosts_file"

          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" -o ConnectTimeout=10 \
            -i deploy/vultr/coin-trading-bot-key.pem)
          remote_last_good="$(ssh "${ssh_opts[@]}" \
            "${VULTR_SSH_USER}@${VULTR_PUBLIC_IP}" \
            'cd /opt/app && if test -s .last-good-sha; then tr -d "[:space:]" < .last-good-sha; else cid="$(docker compose ps -aq app | head -n 1)" && test -n "$cid" && test "$(docker inspect --format "{{.State.Health.Status}}" "$cid")" = healthy && docker inspect --format "{{.Config.Image}}" "$cid"; fi')"
          last_good_sha="${remote_last_good##*:}"
          if ! [[ "$last_good_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: no valid persisted/healthy Vultr rollback SHA; refusing automatic deployment" >&2
            exit 1
          fi
          printf 'PUBLIC_IP=%s\nLAST_GOOD_SHA=%s\n' "$VULTR_PUBLIC_IP" "$last_good_sha" \
            > deploy/vultr/.state
          chmod 600 deploy/vultr/.state
          echo "last_good_sha=$last_good_sha" >> "$GITHUB_OUTPUT"

          # 실패한 배포가 남긴 컨테이너·수동 롤백·정지 뒤에는 .last-good-sha 가 지금 도는 것과 다르다.
          # 원격 검사가 실패하면(컨테이너 없음·healthy 아님) '-' 로 보고 배포한다. SSH 자체가 실패(255)하면
          # 모르는 상태로 재시작하지 않도록 멈춘다.
          rc=0
          running="$(ssh "${ssh_opts[@]}" \
            "${VULTR_SSH_USER}@${VULTR_PUBLIC_IP}" \
            'cd /opt/app && cid="$(docker compose ps -q app | head -n 1)" && test -n "$cid" && test "$(docker inspect --format "{{.State.Health.Status}}" "$cid")" = healthy && docker inspect --format "{{.Config.Image}}" "$cid"')" || rc=$?
          if [[ "$rc" -eq 255 ]]; then
            echo "ERROR: 운영 컨테이너를 조회하는 SSH 가 실패했다 — 다시 실행한다" >&2
            exit 1
          fi
          running_sha="${running##*:}"
          [[ "$rc" -eq 0 && "$running_sha" =~ ^[0-9a-f]{40}$ ]] || running_sha=-
          echo "running_sha=$running_sha" >> "$GITHUB_OUTPUT"

      # 실행한 커밋을 그대로 배포한다. 운영에 들어가는 파일이 그대로면 엔진을 재시작하지 않는다.
      - name: Check production changes since last good deploy
        id: changes
        env:
          FORCE: ${{ inputs.force }}
          LAST_GOOD_SHA: ${{ steps.prepare.outputs.last_good_sha }}
          RUNNING_SHA: ${{ steps.prepare.outputs.running_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo "force — 판정 없이 배포한다"
            exit 0
          fi
          rc=0
          result="$(bash ./deploy/vultr/deploy_needed.sh "$LAST_GOOD_SHA" "$RUNNING_SHA" "$GITHUB_SHA")" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::판정 스크립트가 exit $rc 로 끝났다(3 = 마지막 정상 배포보다 옛 커밋) — 배포하지 않는다"
            exit 1
          fi
          printf '%s\n' "$result"
          decision="${result%%$'\n'*}"
          if [[ "$decision" != 'deploy=true' && "$decision" != 'deploy=false' ]]; then
            echo "::error::판정 출력의 첫 줄이 deploy=true|false 가 아니다: $decision"
            exit 1
          fi
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == 'deploy=false' ]]; then
            echo "::notice::마지막 정상 배포 $LAST_GOOD_SHA 이후 운영에 들어가는 파일 변경이 없어 배포하지 않았다. secret 처럼 파일 밖 변경을 반영하려면 force 로 다시 실행한다."
          fi

      - name: Deploy to Vultr
        if: steps.changes.outputs.deploy == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ github.workspace }}/deploy/vultr/known_hosts
        run: ./deploy/vultr/deploy.sh deploy

      - name: Remove Vultr deploy files
        if: always()
        run: |
          rm -f deploy/vultr/.env deploy/vultr/.state deploy/vultr/coin-trading-bot-key.pem
