name: CI/CD (test + GHCR + Vultr)

# PR 은 테스트만 돌린다. push 와 수동 실행은 이미지를 GHCR 에 올린다.
# main push(머지)는 운영에 자동 배포한다. 배포는 엔진 재시작이라 운영에 들어가는 파일이 바뀐 push 만 배포하고, 운영 compose 의
# app 밖(postgres·caddy 등)이 바뀌었으면 배포하지 않고 경고를 남긴다 — 그때는 봇을 멈출지 정한 뒤 main 수동 실행으로 배포한다.
on:
  push:
    branches: [main]
    # 문서만 바뀐 push 는 테스트·이미지 빌드도 건너뛴다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 마지막 정상 배포 이후 운영에 들어가는 파일 변경이 없어도 배포한다(secret 만 바꾼 경우 등)
        type: boolean
        default: false
      rollback_check:
        description: 마이그레이션이 없어도 롤백 호환 검사(직전 정상 이미지를 새 스키마에 띄우기)를 돌린다
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    # DB 통합테스트용 Postgres. 운영과 같은 이미지를 쓴다.
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_DB: trading
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: trading
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      # 배포는 바뀐 Caddyfile 을 reload 로 적용하므로 틀린 설정은 머지 전에 막는다. 이미지는 compose 의 caddy 와 같게 둔다
      # (CaddyValidateStepTest). APP_DOMAIN 이 비면 사이트 주소가 빈 문자열이 되어 임의 도메인을 준다.
      - name: Caddyfile 검증 (운영과 같은 이미지)
        run: >-
          docker run --rm -e APP_DOMAIN=bot.example.test
          -v "$PWD/deploy/vultr/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.8-alpine@sha256:f6228111e5fafa1a5238258d0858e103f10599b8d1659a146e7726681a002bb9 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          # 기본 enhanced 캐시는 별도 이용약관을 받아야 해서 MIT basic 구현만 쓴다.
          cache-provider: basic
      - name: Test
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: '5432'
          TEST_DB_NAME: trading
          TEST_DB_USER: trading
          TEST_DB_PASSWORD: trading
          # CI 에서는 DB 통합테스트 skip 을 실패로 처리한다.
          DB_TESTS_REQUIRED: 'true'
        run: ./gradlew test --parallel

      # gradle 은 skip 된 테스트도 성공으로 끝내므로 결과 XML 로 실제 실행 여부를 확인한다.
      - name: DB 통합테스트가 실제로 실행됐는지 확인
        run: |
          set -euo pipefail
          # scripts/run-db-tests.sh 의 DB_TEST_CLASSES 와 같은 목록을 유지한다.
          for c in TradingStateRoundTripTest TradeRecordRoundTripTest UserSettingsUpdateRoundTripTest ExchangeDimensionRoundTripTest UserBrokerKeyRoundTripTest BotBookRoundTripTest TradeNotificationOutboxRoundTripTest ErrorAlertOutboxRoundTripTest OrderReconcileQueriesRoundTripTest BotStateEntriesPausedRoundTripTest OrdersRoundTripTest; do
            XML="bot/build/test-results/test/TEST-com.trading.bot.persistence.$c.xml"
            if [ ! -f "$XML" ]; then
              echo "::error::DB 통합테스트 결과가 없다 — 실행되지 않았다 ($XML)"
              exit 1
            fi
            attrs="$(head -3 "$XML")"
            ran="$(printf '%s' "$attrs" | grep -o 'tests="[0-9]*"' | head -1 | tr -dc '0-9')"
            skipped="$(printf '%s' "$attrs" | grep -o 'skipped="[0-9]*"' | head -1 | tr -dc '0-9')"
            echo "DB 통합테스트 $c: 실행 ${ran:-?}건 / skip ${skipped:-?}건"
            if [ "${ran:-0}" = "0" ] || [ "${skipped:-1}" != "0" ]; then
              echo "::error::DB 통합테스트가 건너뛰어졌다 — services: postgres 와 TEST_DB_* 를 확인하라"
              exit 1
            fi
          done

      # 포맷 기준은 .editorconfig 의 ktlint 설정이다. 훅이 없는 편집(Bash·웹 편집)도 여기서 막는다.
      # 테스트 뒤에 두어 포맷 위반이 테스트 결과를 가리지 않게 하고, 테스트가 실패해도 함께 알린다.
      - name: 포맷 검사 (ktlint)
        if: ${{ !cancelled() }}
        run: ./gradlew spotlessCheck

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # 같은 커밋의 push 실행과 수동 실행이 함께 빌드하면 같은 태그를 두 번 덮는다. 어느 쪽이 먼저 오든 뒤의 실행은
    # 앞의 빌드를 기다렸다가 아래 이미지 확인에서 빌드를 건너뛴다.
    concurrency:
      group: image-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # arm64 크로스 빌드용 에뮬레이션
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 베이스 이미지 태그가 떠 있어 같은 커밋을 다시 빌드하면 같은 태그의 내용이 바뀐다. 이미 배포·검증한 태그를
      # 덮으면 재기동·롤백이 검증하지 않은 이미지를 받으므로, 태그가 없을 때만 빌드한다(force 여도). 새 커밋의 push 는
      # 태그가 없으니 늘 빌드하고, 재실행·같은 커밋의 수동 실행이 건너뛴다.
      # 베이스 이미지 패치는 새 커밋으로 받는다 — 새 태그라 직전 정상 SHA 로 자동 롤백할 수 있다.
      - name: Check existing image for this commit
        id: image
        shell: bash
        run: |
          ref="$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          if out="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_SHA 이미지가 이미 있어 다시 빌드하지 않는다"
          else
            echo "$ref 이미지를 확인하지 못해 빌드한다: ${out##*$'\n'}"
          fi
      - name: Build and push app image (amd64 + arm64)
        if: steps.image.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vultr:
    needs: [test, build-and-push]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: vultr-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # push 배포는 테스트·빌드가 끝난 순서로 줄을 서서, 뒤에 머지된 커밋이 먼저 배포될 수 있다. 그 뒤에 도는 옛 커밋은
      # 엔진만 한 번 더 재시작하거나(옛 커밋 거부로) 실패하므로, main 이 앞서 있으면 그 최신 커밋의 실행에 맡긴다.
      # 수동 실행은 사람이 고른 커밋이라 보지 않는다.
      - name: Check deployment commit is current main
        id: main-head
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main --quiet
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 뒤따른 문서 전용 push 는 paths-ignore 로 실행이 생기지 않는다. 여기서 건너뛰면 이 커밋을 배포할 실행이
          # 없으므로, 차이가 문서뿐이면 그대로 배포한다. 제외 목록은 on.push.paths-ignore 와 같게 유지한다.
          code_changes="$(git diff --name-only "$GITHUB_SHA" "$current_main" -- . ':(exclude)**.md' ':(exclude)docs/**')"
          if [[ -z "$code_changes" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
            echo "origin/main($current_main) 이 앞서지만 문서만 다르다 — 이 커밋을 배포한다"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "::notice::main 이 ${current_main:0:12} 로 앞서 있어 ${GITHUB_SHA:0:12} 는 배포하지 않는다 — 최신 커밋의 실행이 배포한다"
          fi

      - name: Prepare Vultr deploy files
        id: prepare
        if: steps.main-head.outputs.current == 'true'
        # 운영을 조회만 하는 스텝이라 시한에 걸려도 서버는 그대로다. SSH 한 번이 최악 약 130초(접속 10 + 무응답 120)다.
        timeout-minutes: 3
        env:
          VULTR_DEPLOY_ENV: ${{ secrets.VULTR_DEPLOY_ENV }}
          VULTR_PUBLIC_IP: ${{ secrets.VULTR_PUBLIC_IP }}
          VULTR_SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_PRIVATE_KEY }}
          VULTR_SSH_USER: ${{ secrets.VULTR_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail

          : "${VULTR_DEPLOY_ENV:?VULTR_DEPLOY_ENV secret is required}"
          : "${VULTR_PUBLIC_IP:?VULTR_PUBLIC_IP secret is required}"
          : "${VULTR_SSH_PRIVATE_KEY:?VULTR_SSH_PRIVATE_KEY secret is required}"
          : "${VULTR_SSH_USER:?VULTR_SSH_USER secret is required}"

          if ! [[ "$VULTR_PUBLIC_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            echo "ERROR: VULTR_PUBLIC_IP must be an IPv4 address" >&2
            exit 1
          fi
          if ! [[ "$VULTR_SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9_.-]*$ ]]; then
            echo "ERROR: VULTR_SSH_USER contains unsupported characters" >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$VULTR_DEPLOY_ENV" > deploy/vultr/.env
          printf 'APP_NAME=coin-trading-bot\nAPP_VERSION=%s\nGHCR_IMAGE=ghcr.io/%s\nSSH_USER=%s\n' \
            "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$VULTR_SSH_USER" >> deploy/vultr/.env
          printf '%s' "$VULTR_SSH_PRIVATE_KEY" > deploy/vultr/coin-trading-bot-key.pem
          chmod 600 deploy/vultr/.env deploy/vultr/coin-trading-bot-key.pem
          known_hosts_file="$GITHUB_WORKSPACE/deploy/vultr/known_hosts"
          test -s "$known_hosts_file"

          ssh_opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
            -i deploy/vultr/coin-trading-bot-key.pem)
          remote_last_good="$(ssh "${ssh_opts[@]}" \
            "${VULTR_SSH_USER}@${VULTR_PUBLIC_IP}" \
            'cd /opt/app && if test -s .last-good-sha; then tr -d "[:space:]" < .last-good-sha; else cid="$(docker compose ps -aq app | head -n 1)" && test -n "$cid" && test "$(docker inspect --format "{{.State.Health.Status}}" "$cid")" = healthy && docker inspect --format "{{.Config.Image}}" "$cid"; fi')"
          last_good_sha="${remote_last_good##*:}"
          if ! [[ "$last_good_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: no valid persisted/healthy Vultr rollback SHA; refusing automatic deployment" >&2
            exit 1
          fi
          printf 'PUBLIC_IP=%s\nLAST_GOOD_SHA=%s\n' "$VULTR_PUBLIC_IP" "$last_good_sha" \
            > deploy/vultr/.state
          chmod 600 deploy/vultr/.state
          echo "last_good_sha=$last_good_sha" >> "$GITHUB_OUTPUT"

          # 실패한 배포가 남긴 컨테이너·수동 롤백·정지 뒤에는 .last-good-sha 가 지금 도는 것과 다르다.
          # 원격 검사가 실패하면(컨테이너 없음·healthy 아님) '-' 로 보고 배포한다. SSH 자체가 실패(255)하면
          # 모르는 상태로 재시작하지 않도록 멈춘다.
          rc=0
          running="$(ssh "${ssh_opts[@]}" \
            "${VULTR_SSH_USER}@${VULTR_PUBLIC_IP}" \
            'cd /opt/app && cid="$(docker compose ps -q app | head -n 1)" && test -n "$cid" && test "$(docker inspect --format "{{.State.Health.Status}}" "$cid")" = healthy && docker inspect --format "{{.Config.Image}}" "$cid"')" || rc=$?
          if [[ "$rc" -eq 255 ]]; then
            echo "ERROR: 운영 컨테이너를 조회하는 SSH 가 실패했다 — 다시 실행한다" >&2
            exit 1
          fi
          running_sha="${running##*:}"
          [[ "$rc" -eq 0 && "$running_sha" =~ ^[0-9a-f]{40}$ ]] || running_sha=-
          echo "running_sha=$running_sha" >> "$GITHUB_OUTPUT"

      # 실행한 커밋을 그대로 배포한다. 운영에 들어가는 파일이 그대로면 엔진을 재시작하지 않는다.
      - name: Check production changes since last good deploy
        id: changes
        if: steps.main-head.outputs.current == 'true'
        env:
          FORCE: ${{ inputs.force }}
          LAST_GOOD_SHA: ${{ steps.prepare.outputs.last_good_sha }}
          RUNNING_SHA: ${{ steps.prepare.outputs.running_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE" == "true" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            echo "force — 판정 없이 배포한다"
            exit 0
          fi
          rc=0
          result="$(bash ./deploy/vultr/deploy_needed.sh "$LAST_GOOD_SHA" "$RUNNING_SHA" "$GITHUB_SHA")" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::판정 스크립트가 exit $rc 로 끝났다(3 = 마지막 정상 배포보다 옛 커밋) — 배포하지 않는다"
            exit 1
          fi
          printf '%s\n' "$result"
          decision="${result%%$'\n'*}"
          if [[ "$decision" != 'deploy=true' && "$decision" != 'deploy=false' ]]; then
            echo "::error::판정 출력의 첫 줄이 deploy=true|false 가 아니다: $decision"
            exit 1
          fi
          echo "$decision" >> "$GITHUB_OUTPUT"
          if [[ "$decision" == 'deploy=false' ]]; then
            echo "::notice::마지막 정상 배포 $LAST_GOOD_SHA 이후 운영에 들어가는 파일 변경이 없어 배포하지 않았다. secret 처럼 파일 밖 변경을 반영하려면 force 로 다시 실행한다."
          fi

      # push 의 자동 배포는 app 컨테이너만 바뀌는 배포에만 한다. 수동 실행은 사람이 시점을 정했으므로 판정하지 않는다.
      - name: Auto deploy gate
        id: gate
        if: steps.changes.outputs.deploy == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          LAST_GOOD_SHA: ${{ steps.prepare.outputs.last_good_sha }}
          VULTR_DEPLOY_ENV: ${{ secrets.VULTR_DEPLOY_ENV }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != push ]]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 보류된 push 는 그 뒤 push 도 같은 이유로 보류되어(마지막 정상 배포가 그대로다) 운영이 main 보다 계속 뒤처진다.
          # 경고 주석만으로는 안 보이므로 배포 webhook 으로도 알린다. webhook 값은 출력하지 않는다.
          hold() {
            echo 'go=false' >> "$GITHUB_OUTPUT"
            echo "::warning::$1"
            (
              # deploy.sh 와 같은 방식(source)으로 읽어야 그 배포가 알리는 webhook 과 같은 값이 된다.
              env_file="$(mktemp)"
              printf '%s\n' "$VULTR_DEPLOY_ENV" > "$env_file"
              set +eu
              set -a
              # shellcheck disable=SC1090
              source "$env_file" > /dev/null 2>&1
              set +a
              rm -f "$env_file"
              bash ./deploy/vultr/notify_deploy.sh failure "자동 배포 보류: ${GITHUB_SHA:0:12} — $1 ${GITHUB_SERVER_URL:-}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
            ) || true
          }
          rc=0
          result="$(bash ./deploy/vultr/auto_deploy_gate.sh "$LAST_GOOD_SHA" "$GITHUB_SHA")" || rc=$?
          printf '%s\n' "$result"
          if [[ "$rc" -ne 0 ]]; then
            hold "자동 배포 판정이 exit $rc 로 끝났다 — main 수동 실행으로 배포한다"
            exit 0
          fi
          if [[ "${result%%$'\n'*}" == 'auto=true' ]]; then
            echo 'go=true' >> "$GITHUB_OUTPUT"
          else
            hold "자동 배포하지 않았다 — ${result#*$'\n'}"
          fi

      # 마이그레이션이 바뀐 배포는 직전 정상 이미지가 새 스키마에서 뜨는지 runner 에서 본다. 통과하면 deploy.sh 가 자동
      # 롤백을 허용한다. 검사가 실패하거나 시한에 걸려도 배포는 진행하고 자동 롤백만 빠진다(지금까지와 같다).
      - name: Rollback compatibility check
        id: compat
        if: (steps.changes.outputs.deploy == 'true' && steps.gate.outputs.go == 'true') || inputs.rollback_check
        continue-on-error: true
        timeout-minutes: 15
        env:
          LAST_GOOD_SHA: ${{ steps.prepare.outputs.last_good_sha }}
          ROLLBACK_CHECK: ${{ inputs.rollback_check }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # 치환을 [[ ]] 밖에서 해야 git diff 실패(직전 SHA 없음)가 set -e 로 멈춘다.
          changed="$(git diff --name-only "$LAST_GOOD_SHA" "$GITHUB_SHA" -- bot/src/main/resources/db/migration/)"
          if [[ "$ROLLBACK_CHECK" != true && -z "$changed" ]]; then
            echo "마이그레이션 변경이 없어 검사하지 않는다(자동 롤백은 원래 허용된다)"
            exit 0
          fi
          printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          rc=0
          bash ./deploy/vultr/rollback_compat.sh "$REGISTRY/$IMAGE_NAME" "$LAST_GOOD_SHA" "$GITHUB_SHA" || rc=$?
          case "$rc" in
            0) echo "compat=$LAST_GOOD_SHA..$GITHUB_SHA" >> "$GITHUB_OUTPUT" ;;
            1) echo "::warning::롤백 비호환 — ${LAST_GOOD_SHA:0:12} 가 새 스키마에서 뜨지 않는다. 이 배포는 자동 롤백하지 않는다" ;;
            *) echo "::warning::롤백 호환 검사 불가(rc=$rc) — 이 배포는 자동 롤백하지 않는다" ;;
          esac

      - name: Deploy to Vultr
        if: steps.changes.outputs.deploy == 'true' && steps.gate.outputs.go == 'true'
        env:
          SSH_KNOWN_HOSTS: ${{ github.workspace }}/deploy/vultr/known_hosts
          ROLLBACK_COMPAT: ${{ steps.compat.outputs.compat }}
        run: ./deploy/vultr/deploy.sh deploy

      - name: Remove Vultr deploy files
        if: always()
        run: |
          rm -f deploy/vultr/.env deploy/vultr/.state deploy/vultr/coin-trading-bot-key.pem
