# 로컬 개발용. 운영은 deploy/vultr 를 쓴다.
# 기본 DB 비밀번호가 trading 이라 포트를 127.0.0.1 에만 연다.
# JWT_SECRET·APP_ENCRYPTION_SECRET 이 비면 임시 키로 뜨므로, 재시작 뒤에도 세션과 저장한 Upbit 키를 쓰려면 .env 에 고정한다.
services:
  app:
    image: ghcr.io/yoon627/coin-trading-bot:${APP_VERSION:-latest}
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trading
      - DB_USER=trading
      - DB_PASSWORD=${DB_PASSWORD:-trading}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
