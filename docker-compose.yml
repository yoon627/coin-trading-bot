# 로컬 개발 전용이다 — 운영 배포는 deploy/vultr(docker-compose.prod.yml + deploy.sh)만 쓴다.
# 포트는 127.0.0.1 에만 연다(기본 DB 비밀번호가 trading 이다). app 은 prod 프로필이 아니라
# JWT_SECRET·APP_ENCRYPTION_SECRET 이 비면 임시 키로 뜬다 — 재시작 뒤 세션·저장한 Upbit 키를 유지하려면 .env 에 고정한다.
services:
  app:
    image: ghcr.io/yoon627/coin-trading-bot:${APP_VERSION:-latest}
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    # 설정은 .env 를 통째로 받는다 — 전달 키 목록을 따로 두면 운영 판처럼 목록 drift 가 생긴다.
    env_file:
      - path: .env
        required: false
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trading
      - DB_USER=trading
      - DB_PASSWORD=${DB_PASSWORD:-trading}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:-trading}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
