# Vultr vc2-1c-2gb(2GB) 운영 스택. 메모리 제한 합계 1440m 에 OS·docker 몫을 더해 2GB 안에 들어가게 잡았다.
# 배포 후 deploy.sh mem 으로 실사용량을 확인한다.

services:
  # prod 는 Secure 쿠키를 쓰므로 HTTPS 종단이 있어야 로그인이 된다.
  caddy:
    image: caddy:2-alpine
    pull_policy: always
    ports:
      - "80:80"                # ACME HTTP-01, 전체 개방 필요
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN is required (e.g. 141-164-1-2.sslip.io)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # 인증서 보관. 없으면 재시작마다 재발급해 Let's Encrypt rate limit 에 걸린다
      - caddy_config:/config
    depends_on:
      app:
        condition: service_started   # app 이 준비되기 전에도 떠서 인증서를 받는다
    restart: unless-stopped
    # 인증서 갱신 때 순간 사용량이 늘어 여유를 둔다.
    mem_limit: 96m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${GHCR_IMAGE:-ghcr.io/yoon627/coin-trading-bot}:${APP_VERSION:-latest}
    pull_policy: always
    expose:
      - "8080"                 # 호스트에 노출하지 않는다
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0
      # 아래 키는 이름만 적는다. .env 에 없으면 전달되지 않아 앱 기본값을 쓴다. 기본값을 여기 쓰면 앱과 갈린다.
      # deploy.sh 의 APP_OVERRIDE_KEYS 와 같게 유지한다.
      - TRADING_TICKERS
      - TRADING_INVEST_RATIO
      - TRADING_MAX_INVEST_AMOUNT
      - TRADING_AUTO_START
      - TRADING_TAKE_PROFIT_PCT
      - TRADING_MAX_LOSS_PCT
      - TRADING_TRAILING_STOP_PCT
      - TRADING_TRAILING_ARM_PCT
      - TRADING_MAX_HOLD_DAYS
      - TRADING_ROUND_TRIP_FEE_RATE
      - TRADING_K_VALUE
      - TRADING_INTERVAL_SECONDS
      - TRADING_RECONCILE_HALT_THRESHOLD
      - TRADING_SHADOW_EXIT_ENABLED
      - TRADING_SHADOW_EXIT_TRAILING_STOP_PCT
      - TRADING_SHADOW_EXIT_TRAILING_ARM_PCT
      # 시세 수집 대상. TRADING_TICKERS 와 별개이며 목록 밖 티커는 REST 로 조회한다.
      - WATCHLIST_TICKERS
      # WS 무수신 워치독. 재연결이 폭주하면 ENABLED=false 로 끈다.
      - MARKETDATA_WATCHDOG_ENABLED
      - MARKETDATA_WATCHDOG_STALE_MS
      - MARKETDATA_WATCHDOG_INTERVAL_MS
      - MARKETDATA_WATCHDOG_INITIAL_DELAY_MS
      - MARKETDATA_WATCHDOG_RESTART_BACKOFF_MS
      # KIS 주식 매매. 엔진에는 아직 연결되지 않았다.
      - KIS_TRADING_ENABLED
      - KIS_TRADING_LIVE_ENABLED
      - KIS_TRADING_INVEST_RATIO
      - KIS_TRADING_MAX_INVEST_AMOUNT
      - KIS_TRADING_MAX_ORDER_AMOUNT
      - KIS_TRADING_TAKE_PROFIT_PCT
      - KIS_TRADING_MAX_LOSS_PCT
      - KIS_TRADING_TRAILING_STOP_PCT
      - KIS_TRADING_TRAILING_ARM_PCT
      - KIS_TRADING_MAX_HOLD_DAYS
      - KIS_TRADING_INTERVAL_SECONDS
      - KIS_TRADING_PAPER_MIN_REQUEST_INTERVAL_MS
      - KIS_TRADING_LIVE_MIN_REQUEST_INTERVAL_MS
      - KIS_TRADING_COMMISSION_RATE
      - KIS_TRADING_SELL_TAX_RATE
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_ERROR_ALERT_ENABLED=${DISCORD_ERROR_ALERT_ENABLED:-false}
      - DISCORD_ERROR_WEBHOOK_URL=${DISCORD_ERROR_WEBHOOK_URL:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=trading
      - DB_USER=trading
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required (prod fails to start without it)}
      - APP_ENCRYPTION_SECRET=${APP_ENCRYPTION_SECRET:?APP_ENCRYPTION_SECRET is required and must stay stable}
      # true 면 JWT 쿠키가 평문 HTTP 로 나간다. TLS 없이 잠깐 띄울 때만 쓴다.
      - APP_AUTH_COOKIE_FORCE_INSECURE=${APP_AUTH_COOKIE_FORCE_INSECURE:-false}
      # CORS 허용 origin 에 https://$APP_DOMAIN 을 넣는다. 없으면 prod 도메인 요청이 403 이다.
      - APP_DOMAIN=${APP_DOMAIN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # 진행 중인 tick 의 주문 후처리가 끝나도록 앱 종료 타임아웃(30s)보다 길게 둔다.
    stop_grace_period: 40s
    mem_limit: 832m
    mem_reservation: 640m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    expose:
      - "5432"                 # 호스트에 노출하지 않는다
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=256MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  caddy_data:
  caddy_config:
