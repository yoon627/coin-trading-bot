spring:
  application:
    name: coin-trading-bot
  # SIGTERM 때 진행 중인 웹 요청을 최대 이만큼 기다린다(server.shutdown=graceful). 엔진 정지는 동기 stop() 이라
  # 이 값이 아니라 ExchangeRuntime.stopBudget 이 묶는다. 바꾸면 compose 의 stop_grace_period 도 본다(ShutdownBudgetTest).
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    user: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 설정 클래스(TradingProperties·AppConfig.kt 등)의 기본값은 클래스에만 두고, env 는 relaxed binding 으로 바로 들어온다.
# 아래 두 키만 env 이름이 relaxed 이름(APP_JWT_SECRET, DISCORD_ERROR_ALERT_WEBHOOK_URL)과 달라 통로를 둔다(AppConfigBindingTest).
# 끝의 `:` 를 빼면 env 가 없을 때 `${JWT_SECRET}` 글자 그대로가 값이 된다.
app:
  jwt-secret: ${JWT_SECRET:}

discord:
  error-alert:
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}

logging:
  level:
    com.trading.bot: DEBUG
