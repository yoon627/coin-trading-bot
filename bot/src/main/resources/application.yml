spring:
  application:
    name: coin-trading-bot
  # SIGTERM 때 진행 중인 웹 요청을 최대 이만큼 기다린다(server.shutdown=graceful). 엔진 정지는 동기 stop() 이라
  # 이 값이 아니라 ExchangeRuntime.stopBudget 이 묶는다. 바꾸면 compose 의 stop_grace_period 도 본다(ShutdownBudgetTest).
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    user: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

upbit:
  base-url: https://api.upbit.com

# trading.* 기본값은 TradingProperties 에만 둔다. 환경변수는 relaxed binding 으로 바로 들어온다.

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-ms: 86400000
  encryption-secret: ${APP_ENCRYPTION_SECRET:}

# watchlist.*·marketdata.watchdog.* 기본값도 같은 이유로 AppConfig.kt 의 설정 클래스에만 둔다.

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  error-alert:
    enabled: ${DISCORD_ERROR_ALERT_ENABLED:false}
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}

logging:
  level:
    com.trading.bot: DEBUG
