spring:
  application:
    name: coin-trading-bot
  # SIGTERM 시 진행 중이던 웹 요청·트레이딩 tick 이 끝나도록 대기(강제 종료 방지). server.shutdown=graceful 과 짝.
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: false
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    username: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:trading}
    user: ${DB_USER:trading}
    password: ${DB_PASSWORD:trading}
    locations: classpath:db/migration

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

upbit:
  access-key: ${UPBIT_ACCESS_KEY:}
  secret-key: ${UPBIT_SECRET_KEY:}
  base-url: https://api.upbit.com

# trading.* 기본값은 TradingProperties 가 유일한 정의처다(#75). 여기서 다시 적으면 두 값이 갈린다.
# TRADING_TAKE_PROFIT_PCT 같은 환경변수는 relaxed binding 으로 직접 바인딩되므로 통로도 필요 없다.

app:
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-ms: 86400000
  encryption-secret: ${APP_ENCRYPTION_SECRET:}

watchlist:
  tickers: ${WATCHLIST_TICKERS:KRW-BTC,KRW-ETH,KRW-XRP,KRW-SOL,KRW-DOGE,KRW-ADA,KRW-AVAX,KRW-LINK,KRW-DOT,KRW-SHIB,KRW-NEAR,KRW-SUI,KRW-HBAR}

# 시세 수집 WS 무수신(half-open) 자동복구 워치독. 매매 정확성은 별도 staleness 게이팅이 보호하므로 피드 복구용 —
# 재연결 폭주 등 오작동 시 enabled=false 로 즉시 비활성(kill-switch). stale-ms 는 watchlist 유동성에 맞춰 조정.
marketdata:
  watchdog:
    enabled: ${MARKETDATA_WATCHDOG_ENABLED:true}
    stale-ms: ${MARKETDATA_WATCHDOG_STALE_MS:60000}
    interval-ms: ${MARKETDATA_WATCHDOG_INTERVAL_MS:20000}
    initial-delay-ms: ${MARKETDATA_WATCHDOG_INITIAL_DELAY_MS:30000}
    restart-backoff-ms: ${MARKETDATA_WATCHDOG_RESTART_BACKOFF_MS:1000}

discord:
  webhook-url: ${DISCORD_WEBHOOK_URL:}
  error-alert:
    enabled: ${DISCORD_ERROR_ALERT_ENABLED:false}
    webhook-url: ${DISCORD_ERROR_WEBHOOK_URL:}

logging:
  level:
    com.trading.bot: DEBUG
